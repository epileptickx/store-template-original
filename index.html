<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Store Template</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Simple Store</h1>
            <nav>
                <a href="#home">Home</a>
                <a href="#products">Products</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
    </header>

    <section id="hero">
        <div class="container">
            <h2>Welcome to Simple Store</h2>
            <p>Generic landing page template for online shop.</p>
            <a href="#products" class="btn">Shop Now</a>
        </div>
    </section>

    <section id="products">
        <div class="container">
            <h2>Featured Items</h2>
            <div class="grid">
                <div class="card">
                    <h3>Item 1</h3>
                    <p>Price: $50</p>
                    <a href="#" class="btn">Buy</a>
                </div>
                <div class="card">
                    <h3>Item 2</h3>
                    <p>Price: $70</p>
                    <a href="#" class="btn">Buy</a>
                </div>
                <div class="card">
                    <h3>Item 3</h3>
                    <p>Price: $90</p>
                    <a href="#" class="btn">Buy</a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Simple Store. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
